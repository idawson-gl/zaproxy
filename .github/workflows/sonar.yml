name: Run Sonar

on: 
  schedule:
    - cron: '30 15 * * SAT'
  workflow_dispatch:

jobs:
  sonar:
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      with:
        fetch-depth: 0
    - name: Setup JDK 11
      uses: actions/setup-java@b6e674f4b717d7b0ae3baee0fbe79f498905dfde # v1
      with:
        java-version: 11
    - name: Gradle Cache
      uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Gradle Test & Coverage Report
      run: ./gradlew test jacocoTestReport -Dorg.gradle.jvmargs=-Xmx4096m
    - name: Sonarcloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.ZAPBOT_SONARCLOUD_TOKEN }}
      run: ./gradlew sonarqube --stacktrace
